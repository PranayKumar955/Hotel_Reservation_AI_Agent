{% extends "base.html" %}
{% block title %}Admin Login | HotelEase{% endblock %}
{% block content %}
<section class="login-wrap"><div class="panel login-panel"><span class="eyebrow">STAFF PORTAL</span><h1>Admin login</h1><p class="muted">Manage rooms and reservations.</p><form method="post" class="stack-form"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Sign in</button></form><p class="small muted">Demo login is documented in README.md.</p></div></section>
{% endblock %}
